name: goslinuly-student-api

services:
  db:
    image: postgres:16-alpine
    container_name: goslinuly-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-goslinuly_db}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - goslinuly-pgdata:/var/lib/postgresql/data
    networks:
      - goslinuly-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: goslinuly-student-api:${APP_TAG:-v1.1-gosling}
    container_name: goslinuly-app
    environment:
      # "db" is the Compose service name, resolved by Docker DNS (not localhost)
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-goslinuly_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8037:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - goslinuly-net
    restart: unless-stopped

volumes:
  goslinuly-pgdata:

networks:
  goslinuly-net:
    driver: bridge
